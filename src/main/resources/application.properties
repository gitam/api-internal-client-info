spring.application.name=client-info
server.port=8080

# Return RFC 9457 problem details for errors (e.g. 404 on unknown client)
spring.mvc.problemdetails.enabled=true

# Mock data source; override with e.g. --client-info.data=file:./my-clients.json
client-info.data=classpath:clients.json

management.endpoints.web.exposure.include=health,info
